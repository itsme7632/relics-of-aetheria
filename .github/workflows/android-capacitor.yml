name: Android Debug APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (commit SHA, branch, or tag)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck game
        working-directory: artifacts/relics-of-aetheria
        run: pnpm typecheck

      - name: Build web (Capacitor base path)
        working-directory: artifacts/relics-of-aetheria
        run: pnpm build
        env:
          PORT: 5173
          BASE_PATH: /

      - name: Copy game assets to dist
        working-directory: artifacts/relics-of-aetheria
        run: |
          mkdir -p dist/public/assets
          cp -r assets/* dist/public/assets/
          echo "PNG assets: $(find dist/public/assets -name '*.png' | wc -l)"
          test -f dist/public/assets/objects/crystal.png
          test -f dist/public/assets/maps/level1.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Capacitor
        working-directory: artifacts/relics-of-aetheria
        run: pnpm add -D @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Add Android platform
        working-directory: artifacts/relics-of-aetheria
        run: npx cap add android

      - name: Configure Android landscape and immersive fullscreen
        working-directory: artifacts/relics-of-aetheria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          activity_re = re.compile(r'<activity\b([^>]*android:name="[^"]*MainActivity"[^>]*)>')
          match = activity_re.search(text)
          if not match:
              raise SystemExit('MainActivity activity not found in AndroidManifest.xml')
          attrs = match.group(1)
          if 'android:screenOrientation=' in attrs:
              attrs = re.sub(r'\s+android:screenOrientation="[^"]*"', '', attrs)
          attrs += ' android:screenOrientation="landscape"'
          text = text[:match.start(1)] + attrs + text[match.end(1):]
          manifest.write_text(text)
          print('MainActivity locked to landscape.')

          java_files = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if not java_files:
              raise SystemExit('MainActivity.java not found')
          activity = java_files[0]
          s = activity.read_text()
          if 'hideSystemBars()' not in s:
              s = s.replace('import android.os.Bundle;\n', 'import android.os.Bundle;\nimport android.view.View;\n')
              method = '''\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        hideSystemBars();\n    }\n\n    @Override\n    public void onWindowFocusChanged(boolean hasFocus) {\n        super.onWindowFocusChanged(hasFocus);\n        if (hasFocus) {\n            hideSystemBars();\n        }\n    }\n\n    private void hideSystemBars() {\n        getWindow().getDecorView().setSystemUiVisibility(\n            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n                | View.SYSTEM_UI_FLAG_FULLSCREEN\n                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n        );\n    }\n'''
              idx = s.rfind('}')
              if idx < 0:
                  raise SystemExit('Could not locate MainActivity class closing brace')
              s = s[:idx] + method + s[idx:]
              activity.write_text(s)
          print(f'Immersive fullscreen configured in {activity}.')
          PY

      - name: Sync Capacitor
        working-directory: artifacts/relics-of-aetheria
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: artifacts/relics-of-aetheria/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: artifacts/relics-of-aetheria
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          unzip -t "$APK" | tail -2
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$APK" && echo "SIGNATURE OK"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "$APK" | head -8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relics-of-aetheria-capacitor-debug
          path: artifacts/relics-of-aetheria/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
