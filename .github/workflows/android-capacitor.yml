name: Android Debug APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (commit SHA, branch, or tag)'
        required: false
        default: '65f44e2ce45f566baa2f1017c53a73433de2532b'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || '65f44e2ce45f566baa2f1017c53a73433de2532b' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck game
        working-directory: artifacts/relics-of-aetheria
        run: pnpm typecheck

      - name: Build web (Capacitor base path)
        working-directory: artifacts/relics-of-aetheria
        run: pnpm build
        env:
          PORT: 5173
          BASE_PATH: /

      - name: Copy game assets to dist
        working-directory: artifacts/relics-of-aetheria
        run: |
          mkdir -p dist/public/assets
          cp -r assets/* dist/public/assets/
          echo "PNG assets: $(find dist/public/assets -name '*.png' | wc -l)"
          test -f dist/public/assets/objects/crystal.png
          test -f dist/public/assets/maps/level1.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: artifacts/relics-of-aetheria
        run: pnpm add -D @capacitor/core @capacitor/cli @capacitor/android --no-frozen-lockfile

      - name: Add Android platform
        working-directory: artifacts/relics-of-aetheria
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/relics-of-aetheria
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: artifacts/relics-of-aetheria/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: artifacts/relics-of-aetheria
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          unzip -t "$APK" | tail -2
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$APK" && echo "SIGNATURE OK"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK" | head -8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relics-of-aetheria-capacitor-debug
          path: artifacts/relics-of-aetheria/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
